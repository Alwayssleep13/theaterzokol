<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Театр Цоколь</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f3f0;
            color: #1e1e1e;
            display: flex;
            flex-direction: column;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            width: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px 6px 24px;
            background: #f5f3f0;
            gap: 16px;
            position: relative;
            z-index: 100;
        }
        .left-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2d2a24, #5f5548);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fefcf9;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            user-select: none;
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .logo-text .sub {
            font-size: 13px; font-weight: 400; color: #7f7366;
            letter-spacing: 1.2px; text-transform: uppercase;
        }
        .logo-text .main {
            font-size: 34px; font-weight: 700; color: #2d2a24;
            letter-spacing: -0.5px;
        }
        .logo-text .main span { color: #a67c5b; }

        /* БЛОК ПОИСКА С ВЫПАДАЮЩИМ СПИСКОМ */
        .search-container {
            position: relative;
            width: 340px;
            max-width: 40%;
            flex-shrink: 0;
        }
        .search-wrapper {
            display: flex;
            align-items: center;
            background: #f0ebe5;
            border-radius: 40px;
            padding: 6px 16px 6px 20px;
            border: 1px solid #d6cec3;
            transition: border 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .search-wrapper:focus-within {
            border-color: #a67c5b;
            box-shadow: 0 0 0 3px rgba(166, 124, 91, 0.15);
            background: #faf8f6;
        }
        .search-wrapper input {
            border: none; background: transparent; padding: 8px 0;
            font-size: 15px; outline: none; width: 100%;
            color: #1e1b16; font-weight: 400;
        }
        .search-wrapper input::placeholder { color: #8f8579; font-weight: 300; }
        .search-wrapper .search-icon {
            color: #8f8579; font-size: 18px; line-height: 1;
            margin-left: 8px; cursor: default;
        }
        .search-clear-btn {
            display: none;
            border: none;
            background: none;
            color: #8f8579;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            margin-left: 4px;
            border-radius: 50%;
            line-height: 1;
            transition: color 0.15s, background 0.15s;
        }
        .search-clear-btn:hover { color: #c0392b; background: rgba(0,0,0,0.05); }
        .search-clear-btn.visible { display: block; }

        /* ВЫПАДАЮЩИЙ СПИСОК */
        .search-results {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #fefcf9;
            border: 1px solid #d6cec3;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            max-height: 420px;
            overflow-y: auto;
            z-index: 500;
            padding: 6px;
            animation: resultsFadeIn 0.15s ease-out;
        }
        .search-results.visible { display: block; }
        @keyframes resultsFadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-results-header {
            padding: 8px 12px 6px;
            font-size: 12px;
            font-weight: 600;
            color: #8f8579;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .search-result-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s;
            border: 1px solid transparent;
        }
        .search-result-item:hover,
        .search-result-item.selected {
            background: #f0ebe5;
            border-color: #e0d9d0;
        }
        .search-result-item .sr-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e1b16;
            line-height: 1.3;
        }
        .search-result-item .sr-title .highlight {
            background: #f3e3b0;
            padding: 0 2px;
            border-radius: 3px;
        }
        .search-result-item .sr-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: #6b5f52;
        }
        .search-result-item .sr-badge {
            display: inline-block;
            background: #e4dbd0;
            color: #5f5548;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.3px;
        }
        .search-result-item .sr-snippet {
            font-size: 13px;
            color: #5f5548;
            line-height: 1.4;
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .search-result-item .sr-snippet .highlight {
            background: #f3e3b0;
            padding: 0 2px;
            border-radius: 3px;
            font-weight: 600;
        }

        .search-no-results {
            padding: 20px 16px;
            text-align: center;
            color: #8f8579;
            font-size: 14px;
        }
        .search-no-results .emoji {
            font-size: 26px;
            display: block;
            margin-bottom: 6px;
        }

        /* ВКЛАДКИ */
        .tabs-wrapper {
            width: 100%; flex-shrink: 0;
            padding: 6px 24px 10px 24px;
            background: #f5f3f0;
        }
        .tabs {
            display: flex; gap: 4px; background: #f0ebe5;
            padding: 4px; border-radius: 40px;
            border: 1px solid #e0d9d0; width: 100%;
        }
        .tab-btn {
            flex: 1; padding: 10px 20px; border: none;
            border-radius: 30px; font-size: 17px; font-weight: 600;
            color: #5f5548; background: transparent; cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            font-family: inherit; letter-spacing: 0.3px; text-align: center;
        }
        .tab-btn:hover { color: #2d2a24; background: rgba(255, 255, 255, 0.5); }
        .tab-btn.active {
            background: #fefcf9; color: #1e1b16;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* КОНТЕЙНЕР */
        .container {
            width: 100%; flex: 1; min-height: 0;
            background: #fefcf9; display: flex; overflow: hidden;
        }

        /* ЛЕВАЯ КОЛОНКА */
        .sidebar {
            width: 280px; min-width: 220px; background: #faf8f6;
            border-right: 1px solid #e6e2dc;
            padding: 20px 18px 16px;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .poem-list {
            display: flex; flex-direction: column; gap: 6px;
            flex: 1; overflow-y: auto; padding-right: 4px;
        }
        .poem-list .poem-item {
            display: flex; align-items: center; padding: 8px 12px;
            border-radius: 14px; cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-weight: 500; color: #2d2a24;
            border: 1px solid transparent; background: transparent;
        }
        .poem-list .poem-item:hover {
            background: #f0ebe5; border-color: #d6cec3;
        }
        .poem-list .poem-item.active {
            background: #e4dbd0; border-color: #c9bdb0; font-weight: 600;
        }
        .poem-list .poem-item .title {
            flex: 1; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }

        /* ПРАВАЯ ЧАСТЬ */
        .content {
            flex: 1; padding: 24px 36px 24px 36px;
            overflow-y: auto; background: #fefcf9;
            position: relative;
        }
        .poem-block {
            margin-bottom: 44px; scroll-margin-top: 20px;
            position: relative;
        }
        .poem-block:last-child { margin-bottom: 0; }
        .poem-header { margin-bottom: 8px; }
        .poem-header h2 {
            font-size: 28px; font-weight: 600;
            letter-spacing: -0.2px; color: #1e1b16;
        }
        .poem-header .author {
            font-size: 17px; color: #6b5f52; font-weight: 400;
        }
        .poem-divider {
            width: 100%; height: 1px; background: #e0d9d0;
            margin: 12px 0 16px 0;
        }
        .poem-body {
            font-size: 18px; line-height: 1.8; color: #26221c;
            white-space: pre-wrap; word-break: break-word;
            background: #fcf9f6; padding: 18px 22px;
            border-radius: 20px; border: 1px solid #ede8e1;
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 60px;
        }

        .highlight {
            background: #f3e3b0; padding: 0 2px;
            border-radius: 4px; font-weight: 500;
        }

        /* РЕЖИМ РЕДАКТИРОВАНИЯ */
        .edit-mode .poem-header h2,
        .edit-mode .poem-header .author,
        .edit-mode .poem-body {
            outline: 2px dashed #a67c5b;
            outline-offset: 4px;
            border-radius: 8px;
            transition: outline 0.15s, background 0.15s;
            cursor: text;
        }
        .edit-mode .poem-header h2:focus,
        .edit-mode .poem-header .author:focus,
        .edit-mode .poem-body:focus {
            outline: 2px solid #a67c5b;
            background: #fffdf9;
        }
        .edit-mode .poem-body { background: #fffdf9; }

        /* Кнопка удаления блока */
        .block-delete-btn {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #8b3a3a;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.1s;
            z-index: 10;
        }
        .block-delete-btn:hover { background: #6e2c2c; transform: scale(1.08); }
        .edit-mode .block-delete-btn { display: flex; }

        /* НОВЫЙ БЛОК — подсветка */
        .poem-block.new-block {
            animation: newBlockPulse 1.2s ease-out;
        }
        @keyframes newBlockPulse {
            0% { background: #f3e3b0; border-radius: 20px; }
            100% { background: transparent; }
        }

        /* ПАНЕЛЬ РЕДАКТИРОВАНИЯ */
        .edit-panel {
            display: none;
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d2a24;
            color: #fefcf9;
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            gap: 10px;
            align-items: center;
            z-index: 1000;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            flex-wrap: wrap;
            justify-content: center;
            max-width: calc(100% - 24px);
        }
        .edit-panel.visible { display: flex; }
        .edit-panel button {
            border: none; padding: 8px 16px; border-radius: 30px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .edit-panel .btn-save { background: #a67c5b; color: #fff; }
        .edit-panel .btn-save:hover { background: #8f684a; }
        .edit-panel .btn-cancel { background: #5f5548; color: #fefcf9; }
        .edit-panel .btn-cancel:hover { background: #4a4238; }
        .edit-panel .btn-add { background: #4a7c59; color: #fff; }
        .edit-panel .btn-add:hover { background: #3a6347; }
        .edit-panel .panel-hint {
            font-size: 13px;
            color: #c9bdb0;
            font-weight: 400;
        }

        /* ФУТЕР */
        .footer {
            width: 100%; flex-shrink: 0;
            padding: 10px 24px 14px 24px;
            background: #f5f3f0;
            display: flex; align-items: center;
            justify-content: space-between;
            font-size: 15px; font-weight: 400;
            color: #7f7366; letter-spacing: 0.5px;
            border-top: 1px solid #e6e2dc; gap: 16px;
        }
        .footer a {
            color: #a67c5b; text-decoration: none;
            font-weight: 500; transition: color 0.2s;
        }
        .footer a:hover { color: #7f5f3f; text-decoration: underline; }

        /* Кнопка-карандаш */
        .edit-pencil-btn {
            background: none;
            border: none;
            padding: 4px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e1e1e;
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .edit-pencil-btn svg {
            width: 22px;
            height: 22px;
            display: block;
            fill: currentColor;
        }
        .edit-pencil-btn:hover {
            color: #a67c5b;
            transform: scale(1.12);
        }
        .edit-pencil-btn.active {
            color: #a67c5b;
        }

        /* МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ */
        .auth-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 27, 22, 0.55);
            backdrop-filter: blur(3px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: authFadeIn 0.2s ease-out;
        }
        .auth-overlay.visible { display: flex; }
        @keyframes authFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .auth-modal {
            background: #fefcf9;
            border-radius: 20px;
            padding: 28px 30px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            animation: authSlideUp 0.25s ease-out;
        }
        @keyframes authSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .auth-modal h3 {
            font-size: 22px;
            font-weight: 700;
            color: #2d2a24;
            margin-bottom: 6px;
        }
        .auth-modal p {
            font-size: 14px;
            color: #6b5f52;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .auth-modal p strong { color: #a67c5b; }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 6px;
            text-align: center;
            border: 2px solid #d6cec3;
            border-radius: 14px;
            background: #faf8f6;
            color: #1e1b16;
            outline: none;
            font-family: 'Courier New', monospace;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 8px;
        }
        .auth-input:focus {
            border-color: #a67c5b;
            box-shadow: 0 0 0 3px rgba(166, 124, 91, 0.15);
            background: #fff;
        }
        .auth-input.error {
            border-color: #c0392b;
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.15);
            animation: shake 0.35s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .auth-error-msg {
            font-size: 13px;
            color: #c0392b;
            font-weight: 500;
            min-height: 18px;
            margin-bottom: 14px;
        }

        .auth-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .auth-actions button {
            border: none;
            padding: 11px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
        }
        .auth-actions .btn-auth-cancel {
            background: #e4dbd0;
            color: #5f5548;
        }
        .auth-actions .btn-auth-cancel:hover { background: #d6cec3; }
        .auth-actions .btn-auth-submit {
            background: #a67c5b;
            color: #fff;
        }
        .auth-actions .btn-auth-submit:hover { background: #8f684a; }
        .auth-actions .btn-auth-submit:disabled {
            background: #c9bdb0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .auth-hint {
            margin-top: 16px;
            padding: 10px 14px;
            background: #f3e3b0;
            border-radius: 10px;
            font-size: 12.5px;
            color: #5f4a2a;
            line-height: 1.5;
            word-break: break-word;
        }
        .auth-hint code {
            background: #2d2a24;
            color: #f3e3b0;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .auth-timer {
            font-size: 12.5px;
            color: #8f8579;
            text-align: center;
            margin-top: 4px;
            margin-bottom: 8px;
            min-height: 16px;
        }

        /* АДАПТИВ */
        @media (max-width: 860px) {
            .top-bar { padding: 8px 12px 4px 12px; flex-wrap: wrap; gap: 8px; }
            .left-group { width: 100%; justify-content: flex-start; }
            .logo-icon { width: 44px; height: 44px; font-size: 22px; }
            .logo-text .main { font-size: 26px; }
            .logo-text .sub { font-size: 11px; }
            .search-container { width: 100%; max-width: 100%; margin-top: 2px; }
            .search-results { max-height: 50vh; }
            .tabs-wrapper { padding: 4px 12px 6px 12px; }
            .tab-btn { font-size: 14px; padding: 8px 12px; }
            .container { flex-direction: column; }
            .sidebar {
                width: 100%; min-width: unset;
                border-right: none; border-bottom: 1px solid #e6e2dc;
                max-height: 34vh; padding: 12px 14px 10px;
            }
            .content { padding: 16px 14px; max-height: 66vh; }
            .poem-body { font-size: 16px; padding: 14px 16px; }
            .poem-header h2 { font-size: 22px; }
            .footer {
                padding: 6px 12px 10px 12px; font-size: 13px;
                flex-wrap: wrap; justify-content: space-between;
            }
            .edit-panel {
                bottom: 10px; padding: 10px 12px; font-size: 13px;
                gap: 6px; flex-wrap: wrap; justify-content: center;
                border-radius: 20px; left: 12px; right: 12px;
                transform: none; white-space: normal;
            }
            .edit-panel button { padding: 6px 12px; font-size: 13px; }
            .edit-panel .panel-hint { display: none; }
            .edit-pencil-btn { width: 28px; height: 28px; }
            .edit-pencil-btn svg { width: 20px; height: 20px; }
            .auth-modal { padding: 22px 20px 20px; }
            .auth-modal h3 { font-size: 19px; }
            .auth-input { font-size: 19px; padding: 12px 14px; letter-spacing: 5px; }
        }

        .sidebar::-webkit-scrollbar,
        .content::-webkit-scrollbar,
        .search-results::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb,
        .content::-webkit-scrollbar-thumb,
        .search-results::-webkit-scrollbar-thumb {
            background: #d6cec3; border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="left-group">
            <div class="logo-icon">🎸</div>
            <div class="logo-text">
                <span class="sub">музыкальный</span>
                <span class="main">Театр <span>Цоколь</span></span>
            </div>
        </div>
        <div class="search-container">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off">
                <button class="search-clear-btn" id="searchClearBtn" title="Очистить" aria-label="Очистить">✕</button>
                <span class="search-icon">🔍</span>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-tab="poems">Стихи</button>
            <button class="tab-btn" data-tab="texts">Тексты</button>
            <button class="tab-btn" data-tab="performances">Постановки</button>
        </div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <div class="poem-list" id="poemList"></div>
        </aside>
        <main class="content" id="contentArea"></main>
    </div>

    <div class="edit-panel" id="editPanel">
        <span class="panel-hint">✏️ Редактирование</span>
        <button class="btn-add" id="btnAddNew">+ Добавить</button>
        <button class="btn-save" id="btnSaveEdit">Сохранить</button>
        <button class="btn-cancel" id="btnCancelEdit">Отмена</button>
    </div>

    <div class="footer">
        <a href="#" target="_blank">ссылка на тг</a>
        <button class="edit-pencil-btn" id="editToggleBtn" title="Редактировать" aria-label="Редактировать">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
            <h3 id="authTitle">🔒 Подтверждение доступа</h3>
            <p>Введите ваш <strong>токен</strong>.</p>

            <input type="text" class="auth-input" id="authCodeInput" autocomplete="off">
            <div class="auth-error-msg" id="authErrorMsg"></div>
            <div class="auth-timer" id="authTimer"></div>

            <div class="auth-actions">
                <button class="btn-auth-cancel" id="btnAuthCancel">Отмена</button>
                <button class="btn-auth-submit" id="btnAuthSubmit">Подтвердить</button>
            </div>
        </div>
    </div>

    <script type="MODULE">
        function cloneData(obj) { return JSON.parse(JSON.stringify(obj)); }

        // ================================================================
        //  ХРАНИЛИЩЕ
        // ================================================================
        var dataSets;

        function loadDataFromStorage() {
            return fetch("./text.json").then(e => e.json());
        }
        const githubPath = "https://api.github.com/repos/Alwayssleep13/theaterzokol/contents/text.json";
        async function textsha() {
            var res = await fetch(githubPath, {
                method: "GET",
                headers: {
                    "Accept": "application/vnd.github+json",
                    "Authorization": `Bearer ${localStorage.getItem('github-token')}`,
                    "X-GitHub-Api-Version": "2026-03-10",
                }
            }).then(e => e.json());
            if (res.status == '401') {
                return null;
            }
            return res.sha;
        }
        async function saveDataToStorage() {
            try {
                await fetch(githubPath, {
                    method: "PUT",
                    headers: {
                        "Accept": "application/vnd.github+json",
                        "Authorization": `Bearer ${localStorage.getItem('github-token')}`,
                        "X-GitHub-Api-Version": "2026-03-10",
                    },
                    body: JSON.stringify({
                        "message": "Update text.json",
                        "content": new TextEncoder().encode(JSON.stringify(dataSets, null, 4)).toBase64(),
                        "sha": await textsha(),
                    })
                });
            } catch (e) { console.warn('Ошибка сохранения:', e); }
        }

        dataSets = await loadDataFromStorage();

        // ================================================================
        //  СОСТОЯНИЕ И ССЫЛКИ
        // ================================================================
        var currentTab = 'poems';
        var isEditMode = false;
        var backupData = null;
        var newBlockIds = [];

        // Поиск
        var searchQuery = '';
        var currentResults = [];
        var selectedResultIndex = -1;

        var sidebarList = document.getElementById('poemList');
        var contentArea = document.getElementById('contentArea');
        var searchInput = document.getElementById('searchInput');
        var searchResults = document.getElementById('searchResults');
        var searchClearBtn = document.getElementById('searchClearBtn');
        var tabBtns = document.querySelectorAll('.tab-btn');
        var editToggleBtn = document.getElementById('editToggleBtn');
        var editPanel = document.getElementById('editPanel');
        var btnSaveEdit = document.getElementById('btnSaveEdit');
        var btnCancelEdit = document.getElementById('btnCancelEdit');
        var btnAddNew = document.getElementById('btnAddNew');

        var authOverlay = document.getElementById('authOverlay');
        var authCodeInput = document.getElementById('authCodeInput');
        var authErrorMsg = document.getElementById('authErrorMsg');
        var authTimer = document.getElementById('authTimer');
        var authHintCode = document.getElementById('authHintCode');
        var btnAuthCancel = document.getElementById('btnAuthCancel');
        var btnAuthSubmit = document.getElementById('btnAuthSubmit');

        var PENCIL_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
        var CROSS_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

        // ================================================================
        //  ВСПОМОГАТЕЛЬНЫЕ
        // ================================================================
        function clearHighlights() {
            var highlights = document.querySelectorAll('.highlight');
            for (var i = 0; i < highlights.length; i++) {
                highlights[i].replaceWith(highlights[i].textContent);
            }
        }
        function scrollToPoem(targetId) {
            var target = document.getElementById(targetId);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ================================================================
        //  РЕНДЕР
        // ================================================================
        function renderContent(items) {
            var html = '';
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var id = 'item-' + currentTab + '-' + i;
                html += '<div class="poem-block" id="' + id + '">';
                html += '  <button class="block-delete-btn" data-target="' + id + '" title="Удалить блок">✕</button>';
                html += '  <div class="poem-header">';
                html += '    <h2 data-field="title">' + escapeHtml(item.title) + '</h2>';
                html += '    <div class="author" data-field="author">' + escapeHtml(item.author) + '</div>';
                html += '  </div>';
                html += '  <div class="poem-divider"></div>';
                html += '  <div class="poem-body" data-field="text">' + escapeHtml(item.text) + '</div>';
                html += '</div>';
            }
            contentArea.innerHTML = html;

            var delBtns = contentArea.querySelectorAll('.block-delete-btn');
            for (var d = 0; d < delBtns.length; d++) {
                (function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (!isEditMode) return;
                        var targetId = this.getAttribute('data-target');
                        if (confirm('Удалить этот блок?')) {
                            removeBlockById(targetId);
                        }
                    });
                })(delBtns[d]);
            }

            if (isEditMode) setEditable(true);
        }

        function renderSidebar(items) {
            var html = '';
            for (var i = 0; i < items.length; i++) {
                var id = 'item-' + currentTab + '-' + i;
                html += '<div class="poem-item" data-target="' + id + '">';
                html += '  <span class="title">' + escapeHtml(items[i].title || '(без названия)') + '</span>';
                html += '</div>';
            }
            sidebarList.innerHTML = html;

            var itemsList = document.querySelectorAll('.poem-item');
            for (var j = 0; j < itemsList.length; j++) {
                (function(el) {
                    el.addEventListener('click', function() {
                        if (isEditMode) return;
                        var targetId = this.getAttribute('data-target');
                        if (targetId) {
                            scrollToPoem(targetId);
                            var all = document.querySelectorAll('.poem-item');
                            for (var k = 0; k < all.length; k++) all[k].classList.remove('active');
                            this.classList.add('active');
                            closeSearchResults();
                            setTimeout(updateActiveFromScroll, 50);
                        }
                    });
                })(itemsList[j]);
            }

            var first = document.querySelector('.poem-item');
            if (first) first.classList.add('active');
        }

        function loadTab(tabKey) {
            currentTab = tabKey;
            renderContent(dataSets[tabKey].items);
            renderSidebar(dataSets[tabKey].items);
            for (var i = 0; i < tabBtns.length; i++) {
                if (tabBtns[i].getAttribute('data-tab') === tabKey) tabBtns[i].classList.add('active');
                else tabBtns[i].classList.remove('active');
            }
            contentArea.scrollTop = 0;
        }

        for (var i = 0; i < tabBtns.length; i++) {
            (function(btn) {
                btn.addEventListener('click', function() {
                    if (isEditMode) return;
                    var tab = this.getAttribute('data-tab');
                    if (tab && tab !== currentTab) {
                        loadTab(tab);
                        closeSearchResults();
                    }
                });
            })(tabBtns[i]);
        }

        // ================================================================
        //  ПОИСК
        // ================================================================
        function highlightInString(str, query) {
            if (!query) return escapeHtml(str);
            var regex = new RegExp('(' + escapeRegex(query) + ')', 'gi');
            return escapeHtml(str).replace(regex, '<span class="highlight">$1</span>');
        }

        function buildSnippet(text, query) {
            if (!text) return '';
            var lowerText = text.toLowerCase();
            var lowerQuery = query.toLowerCase();
            var pos = lowerText.indexOf(lowerQuery);
            if (pos === -1) {
                return escapeHtml(text.substring(0, 100)) + (text.length > 100 ? '…' : '');
            }
            var start = Math.max(0, pos - 40);
            var end = Math.min(text.length, pos + query.length + 60);
            var snippet = text.substring(start, end);
            var prefix = start > 0 ? '…' : '';
            var suffix = end < text.length ? '…' : '';
            return prefix + highlightInString(snippet, query) + suffix;
        }

        // Собирает все результаты по всем разделам
        function collectSearchResults(query) {
            var q = query.trim();
            if (!q) return [];
            var lowerQ = q.toLowerCase();
            var tabKeys = ['poems', 'texts', 'performances'];
            var found = [];
            for (var t = 0; t < tabKeys.length; t++) {
                var tabKey = tabKeys[t];
                var items = dataSets[tabKey].items;
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var inTitle = (item.title || '').toLowerCase().indexOf(lowerQ) !== -1;
                    var inAuthor = (item.author || '').toLowerCase().indexOf(lowerQ) !== -1;
                    var inText = (item.text || '').toLowerCase().indexOf(lowerQ) !== -1;
                    if (inTitle || inAuthor || inText) {
                        found.push({
                            tab: tabKey,
                            tabLabel: dataSets[tabKey].label,
                            index: i,
                            item: item,
                            elementId: 'item-' + tabKey + '-' + i
                        });
                    }
                }
            }
            return found;
        }

        // Живой поиск — вызывается на каждый ввод
        function performLiveSearch(query) {
            searchQuery = query.trim();
            currentResults = collectSearchResults(searchQuery);
            selectedResultIndex = -1;
            renderSearchResults(currentResults, searchQuery);
        }

        function renderSearchResults(results, query) {
            if (!query) {
                closeSearchResults();
                return;
            }
            if (results.length === 0) {
                searchResults.innerHTML =
                    '<div class="search-no-results">' +
                    '<span class="emoji">🔍</span>' +
                    'Ничего не найдено по запросу «' + escapeHtml(query) + '»' +
                    '</div>';
                searchResults.classList.add('visible');
                return;
            }

            var html = '<div class="search-results-header">Найдено: ' + results.length + ' · Enter — к первому</div>';
            for (var i = 0; i < results.length; i++) {
                var r = results[i];
                var selClass = (i === selectedResultIndex) ? ' selected' : '';
                html += '<div class="search-result-item' + selClass + '" data-index="' + i + '" data-tab="' + r.tab + '" data-target="' + r.elementId + '">';
                html += '  <div class="sr-title">' + highlightInString(r.item.title || '(без названия)', query) + '</div>';
                html += '  <div class="sr-meta">';
                html += '    <span class="sr-badge">' + escapeHtml(r.tabLabel) + '</span>';
                html += '    <span>' + highlightInString(r.item.author || '', query) + '</span>';
                html += '  </div>';
                html += '  <div class="sr-snippet">' + buildSnippet(r.item.text || '', query) + '</div>';
                html += '</div>';
            }
            searchResults.innerHTML = html;
            searchResults.classList.add('visible');

            var resultItems = searchResults.querySelectorAll('.search-result-item');
            for (var k = 0; k < resultItems.length; k++) {
                (function(el) {
                    el.addEventListener('click', function() {
                        var tab = this.getAttribute('data-tab');
                        var targetId = this.getAttribute('data-target');
                        goToSearchResult(tab, targetId, searchQuery);
                    });
                    el.addEventListener('mouseenter', function() {
                        var idx = parseInt(this.getAttribute('data-index'), 10);
                        setSelectedResult(idx);
                    });
                })(resultItems[k]);
            }
        }

        // Подсветка выбранного пункта в списке
        function setSelectedResult(idx) {
            selectedResultIndex = idx;
            var resultItems = searchResults.querySelectorAll('.search-result-item');
            for (var i = 0; i < resultItems.length; i++) {
                if (i === idx) resultItems[i].classList.add('selected');
                else resultItems[i].classList.remove('selected');
            }
            // Прокрутить выбранный пункт в видимую область
            if (idx >= 0 && resultItems[idx]) {
                resultItems[idx].scrollIntoView({ block: 'nearest' });
            }
        }

        function goToSearchResult(tab, targetId, query) {
            if (tab !== currentTab) {
                loadTab(tab);
            }
            closeSearchResults();

            setTimeout(function() {
                applyHighlightToBlock(targetId, query);
                scrollToPoem(targetId);

                var all = document.querySelectorAll('.poem-item');
                for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
                var targetItem = document.querySelector('.poem-item[data-target="' + targetId + '"]');
                if (targetItem) targetItem.classList.add('active');
            }, 60);
        }

        function applyHighlightToBlock(targetId, query) {
            var block = document.getElementById(targetId);
            if (!block) return;
            clearHighlights();
            var regex = new RegExp('(' + escapeRegex(query) + ')', 'gi');

            var titleEl = block.querySelector('h2');
            if (titleEl) {
                var origTitle = titleEl.textContent;
                if (origTitle.toLowerCase().indexOf(query.toLowerCase()) !== -1) {
                    titleEl.innerHTML = escapeHtml(origTitle).replace(regex, '<span class="highlight">$1</span>');
                }
            }
            var authorEl = block.querySelector('.author');
            if (authorEl) {
                var origAuthor = authorEl.textContent;
                if (origAuthor.toLowerCase().indexOf(query.toLowerCase()) !== -1) {
                    authorEl.innerHTML = escapeHtml(origAuthor).replace(regex, '<span class="highlight">$1</span>');
                }
            }
            var textEl = block.querySelector('.poem-body');
            if (textEl) {
                var origText = textEl.textContent;
                if (origText.toLowerCase().indexOf(query.toLowerCase()) !== -1) {
                    textEl.innerHTML = escapeHtml(origText).replace(regex, '<span class="highlight">$1</span>');
                }
            }
        }

        function closeSearchResults() {
            searchResults.classList.remove('visible');
            searchResults.innerHTML = '';
            selectedResultIndex = -1;
        }

        function updateClearBtn() {
            if (searchInput.value.length > 0) {
                searchClearBtn.classList.add('visible');
            } else {
                searchClearBtn.classList.remove('visible');
            }
        }

        // ================================================================
        //  ОБРАБОТЧИКИ ПОИСКА
        // ================================================================

        // Живой поиск — на каждый ввод
        searchInput.addEventListener('input', function() {
            updateClearBtn();
            var val = this.value;
            if (!val.trim()) {
                closeSearchResults();
                clearHighlights();
                searchQuery = '';
                currentResults = [];
                return;
            }
            performLiveSearch(val);
        });

        // Enter — переход к первому результату. Стрелки — навигация по списку.
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (currentResults.length > 0) {
                    var idx = selectedResultIndex >= 0 ? selectedResultIndex : 0;
                    var r = currentResults[idx];
                    if (r) goToSearchResult(r.tab, r.elementId, searchQuery);
                }
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (currentResults.length > 0) {
                    var next = selectedResultIndex + 1;
                    if (next >= currentResults.length) next = 0;
                    setSelectedResult(next);
                }
                return;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (currentResults.length > 0) {
                    var prev = selectedResultIndex - 1;
                    if (prev < 0) prev = currentResults.length - 1;
                    setSelectedResult(prev);
                }
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                this.value = '';
                updateClearBtn();
                closeSearchResults();
                clearHighlights();
                searchQuery = '';
                currentResults = [];
                updateActiveFromScroll();
                return;
            }
        });

        searchClearBtn.addEventListener('click', function() {
            searchInput.value = '';
            updateClearBtn();
            closeSearchResults();
            clearHighlights();
            searchQuery = '';
            currentResults = [];
            updateActiveFromScroll();
            searchInput.focus();
        });

        document.addEventListener('click', function(e) {
            var container = document.querySelector('.search-container');
            if (container && !container.contains(e.target)) {
                closeSearchResults();
            }
        });

        function updateActiveFromScroll() {
            if (isEditMode) return;
            var blocks = document.querySelectorAll('.poem-block');
            if (!blocks.length) return;
            var activeIdx = 0;
            var containerRect = contentArea.getBoundingClientRect();
            for (var i = 0; i < blocks.length; i++) {
                if (blocks[i].getBoundingClientRect().top - containerRect.top <= 120) activeIdx = i;
            }
            var items = document.querySelectorAll('.poem-item');
            for (var i = 0; i < items.length; i++) {
                if (i === activeIdx) items[i].classList.add('active');
                else items[i].classList.remove('active');
            }
        }

        contentArea.addEventListener('scroll', function() {
            if (searchInput.value.trim()) return;
            updateActiveFromScroll();
        }, { passive: true });

        // ================================================================
        //  РЕЖИМ РЕДАКТИРОВАНИЯ
        // ================================================================
        function setEditable(on) {
            var blocks = document.querySelectorAll('.poem-block');
            for (var i = 0; i < blocks.length; i++) {
                var fields = blocks[i].querySelectorAll('[data-field]');
                for (var j = 0; j < fields.length; j++) {
                    fields[j].setAttribute('contenteditable', on ? 'true' : 'false');
                    if (on) fields[j].spellcheck = false;
                }
            }
        }

        function updatePencilButton() {
            if (isEditMode) {
                editToggleBtn.innerHTML = CROSS_SVG;
                editToggleBtn.title = 'Выйти из редактирования';
                editToggleBtn.setAttribute('aria-label', 'Выйти из редактирования');
                editToggleBtn.classList.add('active');
            } else {
                editToggleBtn.innerHTML = PENCIL_SVG;
                editToggleBtn.title = 'Редактировать';
                editToggleBtn.setAttribute('aria-label', 'Редактировать');
                editToggleBtn.classList.remove('active');
            }
        }

        function enterEditMode() {
            isEditMode = true;
            backupData = cloneData(dataSets);
            newBlockIds = [];
            document.body.classList.add('edit-mode');
            editPanel.classList.add('visible');
            updatePencilButton();
            setEditable(true);
            clearHighlights();
            closeSearchResults();
            searchInput.value = '';
            updateClearBtn();
            searchQuery = '';
            currentResults = [];
        }

        function exitEditMode() {
            isEditMode = false;
            document.body.classList.remove('edit-mode');
            editPanel.classList.remove('visible');
            updatePencilButton();
            setEditable(false);
            newBlockIds = [];
        }

        function collectEditsFromDOM() {
            var blocks = contentArea.querySelectorAll('.poem-block');
            var newItems = [];
            for (var i = 0; i < blocks.length; i++) {
                var block = blocks[i];
                var titleEl = block.querySelector('[data-field="title"]');
                var authorEl = block.querySelector('[data-field="author"]');
                var textEl = block.querySelector('[data-field="text"]');
                newItems.push({
                    title: titleEl ? titleEl.textContent.trim() : '',
                    author: authorEl ? authorEl.textContent.trim() : '',
                    text: textEl ? textEl.innerText : ''
                });
            }
            dataSets[currentTab].items = newItems;
        }

        function removeBlockById(targetId) {
            var block = document.getElementById(targetId);
            if (!block) return;
            var parts = targetId.split('-');
            var index = parseInt(parts[2], 10);
            collectEditsFromDOM();
            if (dataSets[currentTab] && dataSets[currentTab].items[index] !== undefined) {
                dataSets[currentTab].items.splice(index, 1);
            }
            renderContent(dataSets[currentTab].items);
            renderSidebar(dataSets[currentTab].items);
            var pos = newBlockIds.indexOf(targetId);
            if (pos !== -1) newBlockIds.splice(pos, 1);
        }

        // ================================================================
        //  АВТОРИЗАЦИЯ
        // ================================================================


        function openAuthModal() {
            authCodeInput.value = localStorage.getItem('github-token');
            authCodeInput.disabled = false;
            btnAuthSubmit.disabled = false;
            authCodeInput.classList.remove('error');
            authErrorMsg.textContent = '';
            authOverlay.classList.add('visible');
            setTimeout(function() { authCodeInput.focus(); }, 100);
        }

        function closeAuthModal() {
            authOverlay.classList.remove('visible');
        }

        function showAuthError(msg) {
            authErrorMsg.textContent = msg;
            authCodeInput.classList.add('error');
            authCodeInput.style.animation = 'none';
            void authCodeInput.offsetWidth;
            authCodeInput.style.animation = '';
            authCodeInput.select();
        }

        async function submitAuthModal() {
            var entered = (authCodeInput.value || '').trim();
            localStorage.setItem('github-token', entered);
            try {
                if (!/^[A-Z_a-z0-9]*$/.test(entered)) {
                    localStorage.removeItem('github-token');
                    showAuthError('Неправильный токен. Проверьте раскладку.');
                } else if (await textsha() !== null) {
                    closeAuthModal();
                    enterEditMode();
                } else {
                    localStorage.removeItem('github-token');
                    showAuthError('Неправильный токен');
                }
            } catch (err) {
                localStorage.removeItem('github-token');
                showAuthError('Что-то не получилось');
                throw err;
            }
        }

        // ================================================================
        //  ОБРАБОТЧИКИ КНОПОК
        // ================================================================
        editToggleBtn.addEventListener('click', function() {
            if (!isEditMode) {
                if (localStorage.getItem('github-token') === null) {
                    openAuthModal();
                } else {
                    enterEditMode();
                }
            } else {
                if (backupData) {
                    dataSets = cloneData(backupData);
                    backupData = null;
                }
                exitEditMode();
                loadTab(currentTab);
            }
        });

        btnAuthCancel.addEventListener('click', closeAuthModal);
        btnAuthSubmit.addEventListener('click', submitAuthModal);

        authCodeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); submitAuthModal(); }
            if (e.key === 'Escape') { e.preventDefault(); closeAuthModal(); }
        });

        authOverlay.addEventListener('click', function(e) {
            if (e.target === authOverlay) closeAuthModal();
        });

        btnAddNew.addEventListener('click', function() {
            if (!isEditMode) return;
            collectEditsFromDOM();
            var newIndex = dataSets[currentTab].items.length;
            dataSets[currentTab].items.push({
                title: 'Новый текст',
                author: 'Автор',
                text: ''
            });
            renderContent(dataSets[currentTab].items);
            renderSidebar(dataSets[currentTab].items);
            var newId = 'item-' + currentTab + '-' + newIndex;
            newBlockIds.push(newId);
            var newBlock = document.getElementById(newId);
            if (newBlock) {
                newBlock.classList.add('new-block');
                setTimeout(function() {
                    newBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    var titleEl = newBlock.querySelector('[data-field="title"]');
                    if (titleEl) {
                        titleEl.focus();
                        var range = document.createRange();
                        range.selectNodeContents(titleEl);
                        var sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }, 60);
            }
        });

        btnSaveEdit.addEventListener('click', function() {
            collectEditsFromDOM();
            saveDataToStorage();
            exitEditMode();
            loadTab(currentTab);
        });

        btnCancelEdit.addEventListener('click', function() {
            if (backupData) {
                dataSets = cloneData(backupData);
                backupData = null;
            }
            exitEditMode();
            loadTab(currentTab);
        });

        // ================================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ================================================================
        loadTab('poems');
        updatePencilButton();
        updateClearBtn();

        if (window.location.hash) {
            var hash = window.location.hash.substring(1);
            setTimeout(function() {
                var target = document.getElementById(hash);
                if (target) {
                    scrollToPoem(hash);
                    var item = document.querySelector('.poem-item[data-target="' + hash + '"]');
                    if (item) {
                        var all = document.querySelectorAll('.poem-item');
                        for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
                        item.classList.add('active');
                    }
                }
            }, 150);
        }
    </script>
</body>
</html>
